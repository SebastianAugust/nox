[package]
name = "nox"
version = "0.1.0"
description = "Nox — desktop pet assistant"
authors = ["Bas"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain HTTP to the local Ollama server only, so no TLS backend.
reqwest = { version = "0.13", default-features = false }
tauri-plugin-notification = "2"

# Same sqlx as tauri-plugin-sql, to read settings from Rust at startup.
sqlx = { version = "0.8", default-features = false, features = ["sqlite"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
